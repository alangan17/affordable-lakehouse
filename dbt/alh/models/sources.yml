version: 2

sources:
  - name: ducklake
    description: Local DuckLake catalog stored under the repository data directory.
    database: ducklake
    schema: main
    tables:
      - name: example_events
        description: Events stored in the local DuckLake catalog.
        columns:
          - name: event_id
            description: Unique event identifier.
            data_tests:
              - not_null
              - unique
          - name: event_name
            description: Event type.
          - name: occurred_at
            description: Timestamp at which the event occurred.
